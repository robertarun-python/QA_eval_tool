# Run from backend/: mypy --config-file ../mypy.ini
# Type checking (Phase 4 stability work) - a ratchet: every file listed here
# is type-clean today and must stay that way (tests/test_types.py). The rest
# isn't listed yet - mostly the SQLAlchemy models' old-style Column
# declarations, which mypy can't read (moving them to SQLAlchemy 2.0's
# Mapped[...] is its own piece of work). Add a file once it's clean.
[mypy]
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
files =
    app/__init__.py,
    app/content_schemas.py,
    app/credential_service.py,
    app/database.py,
    app/dependencies.py,
    app/main.py,
    app/migrate_active_session.py,
    app/migrate_assessment_window.py,
    app/migrate_auto_close.py,
    app/migrate_bulk_candidates.py,
    app/migrate_concept_coverage.py,
    app/migrate_final_passing_score_backfill.py,
    app/migrate_indexes.py,
    app/migrate_progressive_coding.py,
    app/migrate_progressive_pipeline.py,
    app/migrate_round2_round4_swap.py,
    app/migrate_round3_code_cache.py,
    app/migrate_round3_coding.py,
    app/migrate_round3_construct_state.py,
    app/migrate_round3_io_format.py,
    app/migrate_round3_subscores.py,
    app/migrate_round3_test_results.py,
    app/migrate_round4_environment_hr_edit.py,
    app/migrate_round_renumber.py,
    app/migrate_round_time_limits.py,
    app/migrate_score_override.py,
    app/migrate_score_provenance.py,
    app/migrate_submitted_at.py,
    app/migrate_tab_switch_guard.py,
    app/routers/__init__.py,
    app/schemas.py,
    app/security.py,
    app/seed.py,
    app/services/__init__.py,
    app/services/clarify_loop.py,
    app/services/fake_llm.py,
    app/services/poc_ai_judge.py,
    app/services/poc_ai_output_detector.py,
    app/services/progressive_policy.py,
    app/services/round3_construct_engine.py,
    app/services/round3_constructs.py,
    app/services/round3_io_format.py,
    app/services/round4_auto_policy.py,
    app/services/round4_pilot_policy.py
